services:
  postgres:
    image: postgres:17
    ports:
      - 5454:5432
    environment:
      POSTGRES_USER: sqlator
      POSTGRES_PASSWORD: sqlator
      POSTGRES_DB: sqlator
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First boot only (empty volume). Re-seed: docker compose down -v
      - ./core/tests/fixtures/engines/postgres.sql:/docker-entrypoint-initdb.d/01-sqlator.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlator -d sqlator"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mysql:
    image: mysql:8.4
    ports:
      - 3336:3306
    environment:
      MYSQL_ROOT_PASSWORD: sqlator
      MYSQL_USER: sqlator
      MYSQL_PASSWORD: sqlator
      MYSQL_DATABASE: sqlator
    volumes:
      - mysqldata:/var/lib/mysql
      - ./core/tests/fixtures/engines/mysql.sql:/docker-entrypoint-initdb.d/01-sqlator.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usqlator", "-psqlator"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mariadb:
    image: mariadb:11
    ports:
      - 3337:3306
    environment:
      MARIADB_ROOT_PASSWORD: sqlator
      MARIADB_USER: sqlator
      MARIADB_PASSWORD: sqlator
      MARIADB_DATABASE: sqlator
    volumes:
      - mariadbdata:/var/lib/mysql
      - ./core/tests/fixtures/engines/mariadb.sql:/docker-entrypoint-initdb.d/01-sqlator.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - 1444:1433
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: Sqlator123!
      MSSQL_DB: sqlator
    volumes:
      - mssqldata:/var/opt/mssql
      - ./core/tests/fixtures/engines/mssql.sql:/init/mssql.sql:ro
      - ./docker/mssql/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["bash", "/entrypoint.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $$MSSQL_SA_PASSWORD -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -Q \"SELECT 1\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  oracle:
    image: gvenzl/oracle-free:latest-faststart
    ports:
      - 1522:1521
    environment:
      ORACLE_PASSWORD: Sqlator123!
    volumes:
      - oracledata:/opt/oracle/oradata
      - ./core/tests/fixtures/engines/oracle.sql:/container-entrypoint-initdb.d/01-sqlator.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - 8123:8123
      - 9000:9000
    environment:
      CLICKHOUSE_USER: sqlator
      CLICKHOUSE_PASSWORD: sqlator
      CLICKHOUSE_DB: sqlator
    volumes:
      - clickhousedata:/var/lib/clickhouse
      - ./core/tests/fixtures/engines/clickhouse.sql:/docker-entrypoint-initdb.d/01-sqlator.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Group C: SSH tunnel concurrency characterization (password auth).
  # From the host: ssh sqlator@localhost -p 2222 (password: sqlator)
  # Tunnel target for postgres on the compose network: postgres:5432
  # custom-cont-init enables AllowTcpForwarding (image default is no).
  openssh:
    image: lscr.io/linuxserver/openssh-server:latest
    ports:
      - 2222:2222
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      PASSWORD_ACCESS: "true"
      USER_PASSWORD: sqlator
      USER_NAME: sqlator
    volumes:
      - ./docker/openssh/cont-init.d:/custom-cont-init.d:ro

volumes:
  pgdata:
  mysqldata:
  mariadbdata:
  mssqldata:
  oracledata:
  clickhousedata:


  # - PostgreSQL: postgresql://sqlator:sqlator@localhost:5454/sqlator
  # - MySQL: mysql://sqlator:sqlator@localhost:3336/sqlator
  # - MariaDB: mysql://sqlator:sqlator@localhost:3337/sqlator
  # - MSSQL: mssql://sa:Sqlator123!@localhost:1444/master
  # - Oracle (experimental): oracle://system:Sqlator123!@localhost:1522/FREEPDB1
  # - ClickHouse: clickhouse://sqlator:sqlator@localhost:8123/sqlator
  # - OpenSSH: ssh://sqlator:sqlator@localhost:2222 (password auth; TCP forward to postgres:5432)

