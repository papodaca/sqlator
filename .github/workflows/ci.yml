# CI for SQLator (plan 006 — GTK testing tiers + headless runner)
name: ci

on:
  push:
    branches: [main, gtk]
  pull_request:
    branches: [main, gtk]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # Fast path: no display server. core + service hold most of the pure logic.
  fast:
    name: fast (core + service)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format (scoped)
        run: cargo fmt -p sqlator-core -p sqlator-service -- --check

      - name: Clippy
        run: cargo clippy -p sqlator-core -p sqlator-service --all-targets -- -D warnings

      - name: Test
        run: cargo test -p sqlator-core -p sqlator-service --locked

  # GTK tier-1 / tier-2 tests need a display + session bus.
  # sqlator-gtk enables gtk4 `gnome_50` / libadwaita `v1_9` / `gtk_v4_22`, which
  # need GLib >= 2.88 and GTK >= 4.22 — newer than Ubuntu 24.04. Arch matches
  # the local GNOME 50 stack used for development.
  gtk:
    name: gtk (xvfb)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install GTK / Blueprint stack
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel git curl \
            gtk4 libadwaita gtksourceview5 glib2 \
            blueprint-compiler \
            pkgconf \
            xorg-server-xvfb \
            dbus

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format (scoped)
        run: cargo fmt -p sqlator-gtk -- --check

      - name: Clippy
        run: cargo clippy -p sqlator-gtk --all-targets -- -D warnings

      - name: Test headlessly
        run: ./gtk/scripts/run-tests-headless.sh
